<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>River</title>
<meta name="description" content="A little crocodile made of watercolour pigment, living in a stream. Paint currents, cut it into twins, feed it colour, and watch it regrow.">
<meta property="og:title" content="River">
<meta property="og:description" content="A little crocodile made of watercolour pigment, living in a stream. Paint currents, cut it into twins, feed it colour, and watch it regrow.">
<link rel="icon" href="../img/hat.svg">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main id="stage" aria-label="The river: drag to use the selected tool">
  <canvas id="gl"></canvas>
  <canvas id="ov"></canvas>
</main>

<header class="top">
  <a class="home" href="../">Steven Kauwe</a>
  <h1>River</h1>
</header>

<div class="corner">
  <p class="count" aria-live="polite"><b>1</b> <span>croc</span></p>
  <div class="menu">
    <button class="pill" id="scenes-btn" aria-haspopup="true" aria-expanded="false" aria-controls="scenes">Scenes</button>
    <ul id="scenes" class="pop" hidden>
      <li><button data-scene="free">Free play</button></li>
      <li><button data-scene="twins">Twins</button></li>
      <li><button data-scene="slit">Slit</button></li>
      <li><button data-scene="fuse">Fuse</button></li>
      <li><button data-scene="dissolve">Dissolve</button></li>
    </ul>
  </div>
  <button class="pill icon" id="surprise" title="Surprise (S)" aria-label="Surprise">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l1.9 4.6 4.9.4-3.7 3.2 1.1 4.8L12 14l-4.2 2.5 1.1-4.8-3.7-3.2 4.9-.4z"/></svg>
  </button>
  <button class="pill icon" id="sound" title="Sound (M)" aria-label="Sound" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="on" d="M15.5 9a4 4 0 010 6M18 6.5a7.5 7.5 0 010 11"/><path class="off" d="M15.5 9.5l5 5m0-5l-5 5"/></svg>
  </button>
</div>

<nav class="dock" aria-label="Tools">
  <button data-tool="current" aria-pressed="true" title="Current (1)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8c2.5-2 4.5-2 7 0s4.5 2 7 0"/><path d="M3 13c2.5-2 4.5-2 7 0s4.5 2 7 0"/><path d="M17.5 15.5l3.5 2-3.5 2"/><path d="M3 17.5h17"/></svg>
    <span>Current</span></button>
  <button data-tool="knife" aria-pressed="false" title="Knife (2)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l9.5-9.5"/><path d="M13.5 10.5L19.5 4.5c1 3-1 7-5 8.5l-1-2.5z"/></svg>
    <span>Knife</span></button>
  <button data-tool="pigment" aria-pressed="false" title="Pigment (3)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5c3 4 5.5 7 5.5 10a5.5 5.5 0 01-11 0c0-3 2.5-6 5.5-10z"/><path d="M9.5 14.5a2.6 2.6 0 002.5 2.5"/></svg>
    <span>Pigment</span></button>
  <button data-tool="rock" aria-pressed="false" title="Rock (4): start on a stone to clear it">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17.5c0-4 2.5-8 7-9.5 4-1.2 8.5 1.5 9 6 .3 2.6-1.5 3.5-4 3.5H6c-1.3 0-2-.4-2-1z"/><path d="M9.5 12.5c1-1 2.3-1.5 3.5-1.4"/></svg>
    <span>Rock</span></button>
  <button data-tool="calm" aria-pressed="false" title="Calm (5)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11h18"/><path d="M6 15h12"/><path d="M9 19h6"/><circle cx="12" cy="5.5" r="1.6"/></svg>
    <span>Calm</span></button>
  <button id="clear" class="clear" title="Clear all currents (C)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12c2.5-2 4.5-2 7 0s4.5 2 7 0"/><path d="M15 17l5-5m0 5l-5-5" transform="translate(-1 2)"/></svg>
    <span>Clear</span></button>
</nav>

<div class="hint" hidden><p></p><button aria-label="Dismiss the hints">&times;</button></div>

<div class="fallback" hidden>
  <img data-still="river-still.webp" data-loop="river-loop.webp" width="1280" height="720" alt="A watercolour crocodile in a stream is torn in two by the current; each half regrows into a whole crocodile.">
  <p>This river needs WebGL2, which this browser does not offer. Here is a clip of it instead.</p>
</div>

<noscript><p class="noscript">River is interactive and needs JavaScript.</p></noscript>
<script type="module" src="app.js"></script>
</body>
</html>
