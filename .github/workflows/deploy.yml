name: Deploy to GitHub Pages

# Publishes the prebuilt PhotoCraft web bundle from storytold/photocraft's latest release.
# Nothing is built here: the release zip is already a static site (index.html, JS glue, .wasm).
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * *" # daily, to pick up new PhotoCraft releases
  workflow_dispatch:
    inputs:
      photocraft_tag:
        description: "PhotoCraft release tag to deploy (blank = latest)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download PhotoCraft web bundle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.photocraft_tag }}
        run: |
          if [ -z "$TAG" ]; then TAG=$(gh release view --repo storytold/photocraft --json tagName --jq .tagName); fi
          echo "Deploying PhotoCraft $TAG"
          gh release download "$TAG" --repo storytold/photocraft --pattern 'photocraft-web-*.zip' --dir dl
          unzip -q dl/photocraft-web-*.zip -d dl/unzipped
          mv dl/unzipped/photocraft-web-* dl/app
          # The web zip ships both licenses but not NOTICE, which Apache-2.0 redistribution requires.
          gh api "repos/storytold/photocraft/contents/NOTICE?ref=$TAG" --jq .content | base64 -d > dl/app/NOTICE
          ls -la dl/app

      - name: Assemble site
        run: |
          mkdir -p _site/photocraft
          cp index.html _site/
          cp -R dl/app/. _site/photocraft/
          find _site -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
